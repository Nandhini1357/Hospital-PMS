version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: hpms_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hpms_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hpms_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:mysql://mysqldb:3306/hpms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      JWT_SECRET: HospitalPharmacyManagementSystemSecretKeyForJWTAuthTokenSigningPhase1Execution2026Secure
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:8081
    depends_on:
      - mysqldb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hpms_frontend
    restart: always
    ports:
      - "8081:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  mysql_data:
