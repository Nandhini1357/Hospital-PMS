# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=springapp

# Database Configuration (MySQL Production Configuration)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/hpms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

# H2 Console (Disabled when running on MySQL)
spring.h2.console.enabled=false

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Settings (Secret must be at least 256 bits / 32 bytes)
app.jwt.secret=${JWT_SECRET:HospitalPharmacyManagementSystemSecretKeyForJWTAuthTokenSigningPhase1Execution2026Secure}
# Token Lifetime Claims (in Milliseconds)
app.jwt.expiration.pharmacist=28800000
# 8 hours = 28800000 ms
app.jwt.expiration.manager=43200000
# 12 hours = 43200000 ms
app.jwt.expiration.admin=86400000
# 24 hours = 86400000 ms
app.jwt.expiration.default=28800000

# OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

